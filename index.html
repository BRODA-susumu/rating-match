<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>レーティング対戦</title>
<style>
:root{color-scheme:dark;}
body{margin:0;font-family:system-ui,-apple-system,'Hiragino Sans',sans-serif;background:#0f1220;color:#f2f4ff;}
.wrap{max-width:480px;margin:0 auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom));}
.card{background:#1a1f33;border-radius:16px;padding:18px;margin-bottom:14px;}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:14px;font-size:17px;font-weight:700;color:#fff;background:#3b5bfd;margin-top:12px;}
.btn:disabled{background:#333a55;color:#8890b0;}
.btn.gray{background:#2a3050;}
.btn.red{background:#e0405a;}
.btn.green{background:#19a974;}
.btn.purple{background:#7b4dd6;}
.sel{outline:3px solid #ffd75e;}
.label{font-size:12px;color:#9aa3c7;letter-spacing:0.05em;}
.rate{font-size:40px;font-weight:800;}
.tableno{font-size:76px;font-weight:900;color:#ffd75e;line-height:1.1;}
.timer{font-size:54px;font-weight:800;font-variant-numeric:tabular-nums;}
.staff{background:#e0405a;color:#fff;border-radius:16px;padding:22px;text-align:center;font-size:24px;font-weight:900;margin-bottom:14px;}
.rowline{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #262c47;font-size:15px;}
input,select{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #2a3050;background:#12162a;color:#fff;font-size:16px;margin-top:8px;}
.center{text-align:center;}
.mut{color:#9aa3c7;font-size:13px;}
.plus{color:#4be38a;}
.minus{color:#ff7a8a;}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:#2a3050;color:#cdd4f5;vertical-align:middle;}
.sb{padding:8px 12px;border-radius:99px;border:0;font-size:12px;font-weight:700;color:#cdd4f5;background:#2a3050;}
.mismatch{background:#5a1f2c;border:1px solid #e0405a;border-radius:12px;padding:12px;color:#ffb3bd;font-size:14px;margin-top:10px;text-align:center;}
.spin{width:44px;height:44px;border:4px solid #2a3050;border-top-color:#3b5bfd;border-radius:50%;margin:10px auto 16px;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
#toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));background:#e0405a;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;display:none;z-index:50;text-align:center;}
#modal{position:fixed;inset:0;background:rgba(0,0,0,0.65);display:none;z-index:40;overflow:auto;padding:16px;}
#mbox{max-width:420px;margin:36px auto;background:#1a1f33;border-radius:16px;padding:18px;}
.tt{display:inline-block;padding:1.5px;vertical-align:middle;clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 50%,calc(100% - 7px) 100%,7px 100%,0 50%);}
.tt>span{display:flex;align-items:center;padding:2px 11px;font-weight:700;font-size:10px;letter-spacing:2px;white-space:nowrap;font-family:'Hiragino Mincho ProN','Yu Mincho',serif;clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 50%,calc(100% - 7px) 100%,7px 100%,0 50%);}
.tt.N{background:linear-gradient(180deg,#cbd4de,#7f8a98);}.tt.N>span{background:#23221e;color:#dfe6ee;}
.tt.R{background:linear-gradient(180deg,#e8c96a,#b18a2c);}.tt.R>span{background:#1d2450;color:#f3e6b8;}
.tt.SR{background:linear-gradient(180deg,#e8c96a,#b18a2c);}.tt.SR>span{background:linear-gradient(180deg,#872424,#6a1a1a);color:#f7e9c2;}
.tt.LR{background:linear-gradient(180deg,#8a5f14,#6b470c);box-shadow:0 0 8px rgba(232,201,106,.4);}.tt.LR>span{background:linear-gradient(180deg,#f6e394,#c79c2e);color:#3a2905;}
.tt.big>span{font-size:13px;padding:4px 15px;letter-spacing:3px;}
.ttrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.coin{color:#ffd75e;font-weight:800;}
.pomc{background:#141830;border:1px solid #262c47;border-radius:12px;padding:10px 12px;margin-top:10px;}
.pomc.live{border-color:#19a974;}
.pomc.done{opacity:.8;}
.porow{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:15px;}
.porow.win{font-weight:900;}
.porow.lose{color:#8890b0;}
.poseed{display:inline-block;min-width:22px;text-align:center;background:#2a3050;border-radius:6px;font-size:11px;font-weight:800;padding:2px 0;color:#cdd4f5;flex-shrink:0;}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;background:#2a3050;color:#cdd4f5;}
.chip.g{background:#123a28;color:#7de8b6;}
.chip.y{background:#4d3d10;color:#ffe9b0;}
.nm2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var SUPA_URL='https://oebpqvuovmhrdjlkpspj.supabase.co';
var ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9lYnBxdnVvdm1ocmRqbGtwc3BqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MTE1NjEsImV4cCI6MjEwNTQ4NzU2MX0.NZz2opTMAt6pcI-zPSLgAOLXvB5D80qkGcD6Jnj1Brw';
var FN=SUPA_URL+'/functions/v1/app';
var sb=window.supabase.createClient(SUPA_URL,ANON);
var S=null,offset=0,viewLock=null,pollT=null,pollOn=false,tickIv=null,busy=false,authMode='login',pendingTp=null;
var histRows=null,histFilter='all';
var TD=null,PO=null,poAt=0,poBusy=false,betM=null,betSel=null;
var notif={ac:null,lastMatch:null,lastResult:null,lastPm:null,overdue:{}};
var firstPoll=true;
function ensureAC(){
 try{
  if(!notif.ac){var C=window.AudioContext||window.webkitAudioContext;if(C){notif.ac=new C();}}
  if(notif.ac&&notif.ac.state==='suspended'){notif.ac.resume();}
 }catch(e){}
}
function playSeq(seq){
 if(!notif.ac){return;}
 try{
  var t=notif.ac.currentTime+0.02;
  for(var i=0;i<seq.length;i++){
   var o=notif.ac.createOscillator();
   var g=notif.ac.createGain();
   o.type='sine';o.frequency.value=seq[i][0];
   g.gain.setValueAtTime(0.0001,t);
   g.gain.exponentialRampToValueAtTime(0.3,t+0.02);
   g.gain.exponentialRampToValueAtTime(0.0001,t+seq[i][1]);
   o.connect(g);g.connect(notif.ac.destination);
   o.start(t);o.stop(t+seq[i][1]+0.02);
   t+=seq[i][1]+0.06;
  }
 }catch(e){}
}
function buzz(kind){
 ensureAC();
 try{
  if(navigator.vibrate){
   navigator.vibrate(kind==='match'?[200,100,200,100,500]:[400,150,400,150,400]);
  }
 }catch(e){}
 if(kind==='match'){playSeq([[660,0.12],[880,0.12],[1320,0.3]]);}
 else{playSeq([[988,0.16],[659,0.16],[988,0.16],[659,0.32]]);}
}
document.addEventListener('touchstart',function(){ensureAC();},{passive:true});
try{pendingTp=new URLSearchParams(location.search).get('tp');}catch(e){}
function app(){return document.getElementById('app');}
function esc(s){s=String(s===null||s===undefined?'':s);var o='',i,c;for(i=0;i<s.length;i++){c=s.charAt(i);if(c==='<'){o+='&lt;';}else if(c==='>'){o+='&gt;';}else if(c==='&'){o+='&amp;';}else if(c==='"'){o+='&quot;';}else{o+=c;}}return o;}
function toastMsg(t){var el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(function(){el.style.display='none';},3500);}
function errMsg(e){if(!e){return 'エラーが発生しました';}return e.message||String(e);}
async function rpc(name,args){var r=await sb.rpc(name,args||{});if(r.error){throw r.error;}return r.data;}
function p2n(n){return (n<10?'0':'')+n;}
function fmtRemain(ms){var s=Math.max(0,Math.ceil(ms/1000));var m=Math.floor(s/60);return m+':'+p2n(s-m*60);}
function fmtWait(s){var m=Math.floor(s/60);return m+'分'+p2n(s-m*60)+'秒';}
function fmtDate(iso){var d=new Date(iso);return (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+p2n(d.getMinutes());}
function kindLabel(k){if(k==='win'){return '勝ち';}if(k==='lose'){return '負け';}if(k==='draw'){return '引き分け';}if(k==='noshow_penalty'){return '不戦敗';}if(k==='opponent_noshow'){return '不成立';}if(k==='timeout_penalty'){return '不成立(両者)';}return '中止';}
function roundName(r,rounds,third){if(third){return '3位決定戦';}if(r===rounds){return '決勝';}if(r===rounds-1){return '準決勝';}if(r===rounds-2){return '準々決勝';}return r+'回戦';}
function ttl(t,big){if(!t){return '';}return '<span class="tt '+esc(t.rarity)+(big?' big':'')+'"><span>'+esc(t.name)+'</span></span>';}
function ttlRow(arr,big){if(!arr||!arr.length){return '';}var h='<div class="ttrow">';for(var i=0;i<arr.length;i++){h+=ttl(arr[i],big);}return h+'</div>';}
function recStr(r){return (r.w||0)+'勝'+(r.l||0)+'敗'+((r.d||0)>0?(r.d+'分'):'');}
function isEditing(){var e=document.activeElement;return !!(e&&(e.tagName==='INPUT'||e.tagName==='SELECT'));}
function modalOpen(){return document.getElementById('modal').style.display==='block';}
function showModal(h){document.getElementById('mbox').innerHTML=h;document.getElementById('modal').style.display='block';}
function hideModal(){document.getElementById('modal').style.display='none';}
async function boot(){var s=await sb.auth.getSession();if(s.data.session){startApp();}else{renderAuth();}}
sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT'){stopApp();renderAuth();}});
async function startApp(){
 if(pendingTp){try{await rpc('join_tournament',{pw:pendingTp});toastMsg('大会に参加しました');}catch(e){toastMsg(errMsg(e));}pendingTp=null;try{history.replaceState(null,'',location.pathname);}catch(e2){}}
 await poll();
 pollOn=true;
 if(tickIv){clearInterval(tickIv);}
 tickIv=setInterval(tick,500);
 schedule();
}
function stopApp(){pollOn=false;clearTimeout(pollT);clearInterval(tickIv);S=null;viewLock=null;firstPoll=true;hideModal();}
async function poll(){
 try{var d=await rpc('get_state');S=d;offset=Date.parse(d.now)-Date.now();checkNotify();render();}catch(e){}
 if(S&&viewLock==='po'&&!poBusy&&Date.now()-poAt>4000){
  poBusy=true;
  try{PO=await rpc('get_playoff');poAt=Date.now();if(!modalOpen()&&viewLock==='po'){drawPo();}}catch(e2){}
  poBusy=false;
 }
 schedule();
}
// 可変ポーリング: 待機中・対戦中・トナメ出場中は2.5秒、トナメ表閲覧中4秒、それ以外10秒、裏に回したら20秒
function pollDelay(){
 if(document.hidden){return 20000;}
 if(!S){return 3000;}
 if(S.queued||S.match){return 2500;}
 var po=S.playoff;
 if(po&&po.status==='active'&&po.alive){return 2500;}
 if(viewLock==='po'){return 4000;}
 return 10000;
}
function schedule(){
 clearTimeout(pollT);
 if(!pollOn){return;}
 pollT=setTimeout(poll,pollDelay());
}
document.addEventListener('visibilitychange',function(){
 if(pollOn&&!document.hidden){clearTimeout(pollT);poll();}
});
function myPm(){
 var pm=S&&S.playoff&&S.playoff.my_pmatch;
 if(pm&&(pm.status==='pending_start'||pm.status==='in_progress')){return pm;}
 return null;
}
function checkNotify(){
 var pm=myPm();
 if(firstPoll){
  firstPoll=false;
  if(S.match){notif.lastMatch=S.match.id;}
  if(pm){notif.lastPm=pm.id;}
  if(S.last_result){notif.lastResult=S.last_result.id;}
  return;
 }
 if(S.match&&S.match.id!==notif.lastMatch){
  notif.lastMatch=S.match.id;
  buzz('match');
 }
 if(pm&&pm.id!==notif.lastPm){
  notif.lastPm=pm.id;
  buzz('match');
 }
 var lr=S.last_result;
 if(lr&&lr.id!==notif.lastResult){
  notif.lastResult=lr.id;
  if(!localStorage.getItem('ack-'+lr.id)&&(Date.now()+offset-Date.parse(lr.at))<3600000){
   buzz((lr.kind==='win'||lr.kind==='lose'||lr.kind==='draw')?'match':'alert');
  }
 }
}
function tick(){
 if(!S){return;}
 var el;
 if(S.match&&S.match.status==='pending_start'){
  var rem=Date.parse(S.match.start_deadline)-(Date.now()+offset);
  el=document.getElementById('cd');
  if(el){el.textContent=fmtRemain(rem);if(rem<=0&&!document.getElementById('staffbox')){if(!notif.overdue[S.match.id]){notif.overdue[S.match.id]=1;buzz('alert');}render();}}
 }
 if(S.queued&&!S.match){
  var w=Math.max(0,Math.floor((Date.now()+offset-Date.parse(S.queued.since))/1000));
  el=document.getElementById('wt');if(el){el.textContent=fmtWait(w);}
  el=document.getElementById('wr');if(el){el.textContent='±'+(100+100*Math.floor(w/30));}
 }
 var bds=document.querySelectorAll('[data-bd]');
 for(var i=0;i<bds.length;i++){
  var rem2=Date.parse(bds[i].getAttribute('data-bd'))-(Date.now()+offset);
  bds[i].textContent=rem2<=0?'締切':fmtRemain(rem2);
 }
}
function render(){
 if(!S){return;}
 if(S.match){viewLock=null;renderMatch(S.match);return;}
 var pm=myPm();
 if(pm){viewLock=null;renderPMatch(pm);return;}
 if(viewLock){return;}
 if(isEditing()){return;}
 var lr=S.last_result;
 if(lr&&!localStorage.getItem('ack-'+lr.id)&&(Date.now()+offset-Date.parse(lr.at))<3600000){renderResult(lr);return;}
 if(S.new_titles&&S.new_titles.length){renderNewTitles();return;}
 if(S.playoff&&S.playoff.i_won&&!localStorage.getItem('champ-'+S.playoff.id)){renderChampion(S.playoff);return;}
 if(S.queued){renderQueue();return;}
 renderHome();
}
function renderAuth(){
 var h='<div class="wrap"><div class="card center"><div style="font-size:22px;font-weight:800;">レーティング対戦</div><div class="mut">大会マッチングシステム</div></div>';
 h+='<div class="card"><div style="display:flex;gap:8px;">';
 h+='<button class="btn '+(authMode==='login'?'':'gray')+'" style="margin-top:0;" data-act="tab-login">ログイン</button>';
 h+='<button class="btn '+(authMode==='register'?'':'gray')+'" style="margin-top:0;" data-act="tab-register">新規登録</button></div>';
 if(authMode==='register'){h+='<input id="nick" placeholder="ニックネーム（20文字まで）">';}
 h+='<input id="email" type="email" placeholder="メールアドレス">';
 h+='<input id="pass" type="password" placeholder="パスワード（6文字以上）">';
 h+='<input id="tpw0" placeholder="大会パスワード（任意・あとからでも入力できます）">';
 if(authMode==='register'){h+='<button class="btn" data-act="register">登録してはじめる</button><div class="mut" style="margin-top:8px;">ニックネームは登録後、1回だけ変更できます。同じニックネームは使えません。</div>';}
 else{h+='<button class="btn" data-act="login">ログイン</button><div class="center" style="margin-top:12px;"><span class="mut" style="text-decoration:underline;cursor:pointer;" data-act="forgot">パスワードを忘れた方</span></div>';}
 h+='</div></div>';
 app().innerHTML=h;
}
function renderHome(){
 var p=S.profile;var t=S.tournament;var po=S.playoff;
 var keepEl=document.getElementById('tpw');var keep=keepEl?keepEl.value:'';
 var h='<div class="wrap">';
 h+='<div class="card"><div class="label">ニックネーム</div><div style="font-size:20px;font-weight:700;">'+esc(p.nickname)+(p.is_admin?' <span class="badge">主催</span>':'')+'</div>';
 h+=ttlRow(p.titles,false);
 h+='<div style="display:flex;gap:20px;margin-top:12px;align-items:flex-end;flex-wrap:wrap;">';
 h+='<div><div class="label">通算レート</div><div class="rate">'+p.rating+'</div></div>';
 if(t&&p.day!==null&&p.day!==undefined){h+='<div><div class="label">当日レート</div><div class="rate" style="font-size:30px;">'+p.day+'</div></div>';}
 h+='<div style="margin-left:auto;"><div class="label">コイン</div><div class="coin" style="font-size:24px;">'+p.coins+'</div></div>';
 h+='</div></div>';
 if(t){
  h+='<div class="card"><div class="label">参加中の大会</div><div style="font-size:17px;font-weight:700;">'+esc(t.name)+'</div>';
  if(t.rated===false){h+='<div class="mut" style="margin-top:6px;">交流会モード（レート変動なし）</div>';}
  else if(t.match_basis==='day'){h+='<div class="mut" style="margin-top:6px;">マッチング基準: 当日レート</div>';}
  if(t.matching_paused){h+='<div class="mut" style="margin-top:6px;">現在、対戦募集は停止中です</div>';}
  h+='</div>';
 }else{
  h+='<div class="card"><div class="label">大会に参加</div><input id="tpw" placeholder="大会パスワード" value="'+esc(keep)+'"><button class="btn" data-act="join">大会に参加する</button><div class="mut" style="margin-top:8px;">大会パスワードを入力するまで対戦募集はできません。</div></div>';
 }
 if(po){
  h+='<div class="card">';
  if(po.status==='finished'){
   h+='<div class="label">トーナメント</div><div style="font-size:17px;font-weight:900;margin-top:4px;">🏆 優勝: '+esc(po.winner||'')+'</div>';
  }else{
   h+='<div class="label">🏆 トーナメント進行中</div>';
   if(po.alive&&po.my_pmatch&&po.my_pmatch.status==='waiting'){
    h+='<div style="margin-top:6px;font-weight:700;">'+roundName(po.my_pmatch.round,po.rounds,po.my_pmatch.is_third)+' — '+(po.my_pmatch.has_opp?'卓の割り当てを待っています':'対戦相手の勝ち上がりを待っています')+'</div>';
   }else if(!po.alive){
    h+='<div class="mut" style="margin-top:6px;">試合をタップして勝利者予想（コインベット）ができます</div>';
   }
  }
  h+='<button class="btn purple" data-act="po" style="margin-top:10px;">トーナメント表'+(po.status==='active'&&!po.alive?'・勝利者予想':'')+'</button></div>';
 }
 var can=t&&!t.matching_paused&&!(po&&po.alive);
 if(t){h+='<button class="btn" style="padding:22px;font-size:20px;" data-act="queue"'+(can?'':' disabled')+'>対戦募集</button>';}
 if(po&&po.alive){h+='<div class="mut center" style="margin-top:6px;">トーナメント進行中は対戦募集できません</div>';}
 h+='<button class="btn gray" data-act="titles">称号・実績</button>';
 h+='<button class="btn gray" data-act="history">対戦履歴</button>';
 if(t&&po){h+='<button class="btn gray" data-act="ranking">ランキング</button>';}
 h+='<div style="display:flex;gap:8px;">';
 if(!p.nickname_changed){h+='<button class="btn gray" data-act="nick" style="font-size:14px;">ニックネーム変更</button>';}
 h+='<button class="btn gray" data-act="pwchg" style="font-size:14px;">パスワード変更</button>';
 h+='<button class="btn gray" data-act="logout" style="font-size:14px;">ログアウト</button></div>';
 h+='</div>';
 app().innerHTML=h;
}
function renderQueue(){
 var h='<div class="wrap"><div class="card center"><div class="spin"></div><div style="font-size:18px;font-weight:700;">対戦相手を探しています…</div>';
 h+='<div class="mut" style="margin-top:10px;">待機時間 <span id="wt">0分00秒</span></div>';
 h+='<div class="mut">許容レート差 <span id="wr">±100</span>（30秒ごとに拡大）</div></div>';
 h+='<button class="btn red" data-act="cancel">募集をキャンセル</button>';
 h+='<div class="mut center" style="margin-top:10px;">マッチング成立後のキャンセルはできません。</div></div>';
 app().innerHTML=h;
}
function oppBlock(o,myR,myD){
 var h='<div class="card"><div style="display:flex;align-items:center;gap:8px;"><span class="mut">対戦相手</span><b style="font-size:17px;">'+esc(o.nickname)+'</b></div>';
 h+=ttlRow(o.titles,false);
 h+='<div class="rowline" style="margin-top:6px;"><span class="mut">相手のレート</span><b>通算 '+o.rating+(o.day!==null&&o.day!==undefined?' ／ 当日 '+o.day:'')+'</b></div>';
 h+='<div class="rowline" style="border-bottom:0;"><span class="mut">あなたのレート</span><b>通算 '+myR+(myD!==null&&myD!==undefined?' ／ 当日 '+myD:'')+'</b></div></div>';
 return h;
}
function renderMatch(m){
 if(m.status==='pending_start'){
  var rem=Date.parse(m.start_deadline)-(Date.now()+offset);

 {

  var b=m.my_bet;var bn=(b.pick==='p1'?(m.p1?m.p1.nickname:'P1'):(m.p2?m.p2.nickname:'P2'));
  var bs='';
  if(b.status==='won'){bs=' <span class="plus">→ +'+b.payout+'獲得！</span>';}
  else if(b.status==='lost'){bs=' <span class="minus">→ はずれ</span>';}
  else if(b.status==='refunded'){bs=' <span class="mut">→ 返還</span>';}
  h+='<div style="font-size:12px;margin-top:4px;" class="coin">ベット: '+esc(bn)+' に '+b.amount+'枚（'+b.odds+'倍）'+bs+'</div>';
 }else if(m.can_bet){
  h+='<div class="mut" style="font-size:11px;margin-top:4px;">タップして勝利者予想</div>';
 }
 if((m.pool1||0)+(m.pool2||0)>0){h+='<div class="mut" style="font-size:11px;margin-top:2px;">みんなの予想 🪙'+(m.pool1||0)+' vs 🪙'+(m.pool2||0)+'</div>';}
 h+='</div>';
 return h;
}
function drawPo(){
 if(viewLock!=='po'||!PO){return;}
 var h='<div class="wrap">';
 h+='<div class="card">';
 if(PO.status==='finished'){
  h+='<div class="center"><div style="font-size:40px;">👑</div><div style="font-size:20px;font-weight:900;color:#f6e394;">優勝: '+esc(PO.winner||'')+'</div>'+(PO.winner_title?'<div style="display:flex;justify-content:center;margin-top:6px;">'+ttl(PO.winner_title,false)+'</div>':'')+'</div>';
 }else{
  h+='<div style="font-weight:800;font-size:17px;">🏆 トーナメント表</div>';
  if(!PO.alive&&PO.status==='active'){h+='<div class="mut" style="margin-top:6px;">試合をタップすると勝利者予想ができます（所持コインの20%まで）<br>所持コイン: <span class="coin">🪙'+PO.my_coins+'</span></div>';}
  else if(PO.alive){h+='<div class="mut" style="margin-top:6px;">出場中はベットできません</div>';}
 }
 h+='</div>';
 var ms=PO.matches||[];
 for(var r=1;r<=PO.rounds;r++){
  h+='<div class="label" style="margin:12px 4px 0;">'+roundName(r,PO.rounds,false)+'</div>';
  for(var i=0;i<ms.length;i++){if(ms[i].round===r&&!ms[i].third){h+=poCard(ms[i]);}}
 }
 if(PO.third){
  h+='<div class="label" style="margin:12px 4px 0;">3位決定戦</div>';
  for(var j=0;j<ms.length;j++){if(ms[j].third){h+=poCard(ms[j]);}}
 }
 h+='<button class="btn gray" data-act="back" style="margin-top:16px;">戻る</button></div>';
 app().innerHTML=h;
}
function openBet(m){
 betM=m;betSel=null;
 drawBet();
}
function drawBet(){
 var m=betM;
 var cap=Math.max(1,Math.floor((PO.my_coins||0)*0.2));
 var h='<div style="font-weight:800;font-size:16px;">勝利者予想 — '+roundName(m.round,PO.rounds,m.third)+(m.table_no?'（卓'+m.table_no+'）':'')+'</div>';
 h+='<div class="mut" style="margin-top:6px;">どちらが勝つと思いますか？</div>';
 h+='<button class="btn gray'+(betSel==='p1'?' sel':'')+'" data-act="betpick" data-side="p1">'+esc(m.p1.nickname)+'（'+m.odds.p1+'倍）</button>';
 h+='<button class="btn gray'+(betSel==='p2'?' sel':'')+'" data-act="betpick" data-side="p2">'+esc(m.p2.nickname)+'（'+m.odds.p2+'倍）</button>';
 h+='<input id="bamt" type="number" inputmode="numeric" placeholder="掛けるコイン枚数（最大'+cap+'）" value="'+(document.getElementById('bamt')?esc(document.getElementById('bamt').value):'')+'">';
 h+='<div class="mut" style="margin-top:8px;">所持 🪙'+PO.my_coins+' の20%（'+cap+'枚）まで掛けられます。<br>的中すると 掛け枚数×オッズ を獲得。はずれると没収されます。<br>ベットは1試合1回・変更不可。締切は両者の対戦開始から3分後です。</div>';
 h+='<button class="btn" data-act="betgo">ベットする</button>';
 h+='<button class="btn gray" data-act="mclose">やめる</button>';
 showModal(h);
}
function val(id){var e=document.getElementById(id);return e?e.value.trim():'';}
document.addEventListener('click',async function(ev){
 ensureAC();
 var el=ev.target.closest('[data-act]');
 if(!el||busy){return;}
 var act=el.getAttribute('data-act');
 busy=true;
 try{
  if(act==='forgot'){
   showModal('<div style="font-weight:800;font-size:16px;">パスワードを忘れた方</div><div style="margin-top:10px;font-size:14px;line-height:1.7;">大会会場のスタッフ（主催）に、<b>ニックネーム</b>を伝えてください。仮パスワードを発行します。<br><br>仮パスワードでログインしたあと、ホーム画面下の「パスワード変更」から好きなパスワードに変更できます。<br><span class="mut">レートや称号、コインはそのまま引き継がれます。</span></div><button class="btn gray" data-act="mclose">閉じる</button>');
  }
  else if(act==='tab-login'){authMode='login';renderAuth();}
  else if(act==='tab-register'){authMode='register';renderAuth();}
  else if(act==='login'){
   var tp0=val('tpw0');
   var r=await sb.auth.signInWithPassword({email:val('email'),password:val('pass')});
   if(r.error){toastMsg('ログインに失敗しました。メールアドレスとパスワードを確認してください');}
   else{if(tp0){pendingTp=tp0;}startApp();}
  }
  else if(act==='register'){
   var em=val('email'),pw=val('pass'),nk=val('nick'),tp1=val('tpw0');
   var res=await fetch(FN+'/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw,nickname:nk})});
   var j=await res.json();
   if(!res.ok){toastMsg(j.error||'登録に失敗しました');}
   else{
    var r2=await sb.auth.signInWithPassword({email:em,password:pw});
    if(r2.error){toastMsg('登録は完了しました。ログインしてください');authMode='login';renderAuth();}
    else{if(tp1){pendingTp=tp1;}startApp();}
   }
  }
  else if(act==='join'){await rpc('join_tournament',{pw:val('tpw')});toastMsg('大会に参加しました');await poll();}
  else if(act==='queue'){await rpc('enqueue');await poll();}
  else if(act==='cancel'){await rpc('cancel_queue');await poll();}
  else if(act==='start'){await rpc('press_start',{mid:S.match.id});await poll();}
  else if(act==='rep'){await rpc('report_result',{mid:S.match.id,rep:el.getAttribute('data-res')});await poll();}
  else if(act==='pstart'){await rpc('playoff_press_start',{pmid:S.playoff.my_pmatch.id});await poll();}
  else if(act==='prep'){await rpc('playoff_report',{pmid:S.playoff.my_pmatch.id,rep:el.getAttribute('data-res')});await poll();}
  else if(act==='ack'){localStorage.setItem('ack-'+S.last_result.id,'1');render();}
  else if(act==='ackt'){await rpc('ack_titles');await poll();}
  else if(act==='champack'){localStorage.setItem('champ-'+el.getAttribute('data-pid'),'1');render();}
  else if(act==='history'){await renderHistory();}
  else if(act==='ranking'){await renderRanking();}
  else if(act==='titles'){await renderTitlesView();}
  else if(act==='po'){await renderPo();}
  else if(act==='eq'){
   var eq1=(TD.equipped||[]).slice();
   if(eq1.length>=3){toastMsg('称号は3個まで設定できます。先にどれかを外してください');}
   else{eq1.push(parseInt(el.getAttribute('data-id'),10));await setEq(eq1);}
  }
  else if(act==='uneq'){
   var id2=parseInt(el.getAttribute('data-id'),10);
   var eq2=(TD.equipped||[]).filter(function(x){return x!==id2;});
   await setEq(eq2);
  }
  else if(act==='buy'){
   var tb=tById(parseInt(el.getAttribute('data-id'),10));
   if(tb&&confirm('「'+tb.name+'」を 🪙'+tb.price+' で交換しますか？')){
    var out=await rpc('buy_title',{p_title:tb.id});
    toastMsg('「'+out.name+'」を獲得しました！');
    TD=await rpc('get_titles');drawTitles();poll();
   }
  }
  else if(act==='pom'){
   var pomm=poFind(el.getAttribute('data-mid'));
   if(pomm&&pomm.can_bet){openBet(pomm);}
  }
  else if(act==='betpick'){betSel=el.getAttribute('data-side');drawBet();}
  else if(act==='betgo'){
   if(!betSel){toastMsg('どちらが勝つか選んでください');}
   else{
    var amt=parseInt(val('bamt'),10);
    if(isNaN(amt)||amt<1){toastMsg('掛けるコイン枚数を入力してください');}
    else{
     var bn2=(betSel==='p1'?betM.p1.nickname:betM.p2.nickname);
     if(confirm(bn2+' に 🪙'+amt+' をベットします。変更・キャンセルはできません。よろしいですか？')){
      var bres=await rpc('place_bet',{pmid:betM.id,p_pick:betSel,p_amount:amt});
      toastMsg(bn2+' に '+amt+'枚（'+bres.odds+'倍）ベットしました！的中で'+bres.potential+'枚');
      hideModal();
      PO=await rpc('get_playoff');poAt=Date.now();drawPo();poll();
     }
    }
   }
  }
  else if(act==='mclose'){hideModal();}
  else if(act==='histflt'){histFilter=el.getAttribute('data-tn');drawHistory();}
  else if(act==='back'){viewLock=null;hideModal();render();}
  else if(act==='nick'){
   var n=prompt('新しいニックネーム（変更できるのは1回だけです）');
   if(n){await rpc('change_nickname',{newnick:n});toastMsg('ニックネームを変更しました');await poll();}
  }
  else if(act==='pwchg'){
   var ph='<div style="font-weight:800;font-size:16px;">パスワード変更</div>';
   ph+='<input id="npw1" type="password" placeholder="新しいパスワード（6文字以上）">';
   ph+='<input id="npw2" type="password" placeholder="もう一度入力">';
   ph+='<button class="btn" data-act="pwgo">変更する</button>';
   ph+='<button class="btn gray" data-act="mclose">やめる</button>';
   showModal(ph);
  }
  else if(act==='pwgo'){
   var n1=val('npw1'),n2=val('npw2');
   if(n1.length<6){toastMsg('パスワードは6文字以上にしてください');}
   else if(n1!==n2){toastMsg('2回の入力が一致しません');}
   else{
    var ur=await sb.auth.updateUser({password:n1});
    if(ur.error){toastMsg('変更できませんでした: '+ur.error.message);}
    else{hideModal();toastMsg('パスワードを変更しました');}
   }
  }
  else if(act==='logout'){await sb.auth.signOut();}
 }catch(e){toastMsg(errMsg(e));}
 busy=false;
});
boot();
</script>
</body>
</html>
