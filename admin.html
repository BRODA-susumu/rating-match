<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>主催管理 - レーティング対戦</title>
<style>
:root{color-scheme:dark;}
body{margin:0;font-family:system-ui,-apple-system,'Hiragino Sans',sans-serif;background:#0f1220;color:#f2f4ff;}
.wrap{max-width:520px;margin:0 auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom));}
.card{background:#1a1f33;border-radius:16px;padding:16px;margin-bottom:14px;}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;font-size:15px;font-weight:700;color:#fff;background:#3b5bfd;margin-top:10px;}
.btn.gray{background:#2a3050;}
.btn.red{background:#e0405a;}
.btn.green{background:#19a974;}
.btn.warn{background:#c98a12;}
.inline{display:flex;gap:8px;flex-wrap:wrap;}
.inline .btn{flex:1;margin-top:8px;padding:12px;font-size:13px;min-width:100px;}
.sb{padding:7px 10px;border-radius:8px;border:0;font-size:12px;font-weight:700;color:#fff;background:#2a3050;margin-left:6px;}
.sb.red{background:#e0405a;}
.label{font-size:12px;color:#9aa3c7;letter-spacing:0.05em;}
input,select{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid #2a3050;background:#12162a;color:#fff;font-size:16px;margin-top:8px;}
.center{text-align:center;}
.mut{color:#9aa3c7;font-size:13px;}
.plus{color:#4be38a;}
.minus{color:#ff7a8a;}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:#2a3050;color:#cdd4f5;vertical-align:middle;}
.badge.on{background:#123a28;color:#7de8b6;}
.badge.off{background:#3a1520;color:#ff9aa8;}
.rowline{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #262c47;font-size:14px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
.tc{border-radius:12px;padding:8px 5px;text-align:center;min-height:64px;background:#141830;border:1px dashed #2a3050;color:#5f6a94;font-size:11px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.tc .no{font-size:17px;font-weight:800;}
.tc.p{background:#4d3d10;border:1px solid #c98a12;color:#ffe9b0;}
.tc.o{background:#5a1f2c;border:1px solid #e0405a;color:#ffc9d1;}
.tc.g{background:#123a28;border:1px solid #19a974;color:#b8f5d8;}
.tc.x{opacity:0.55;border:1px dashed #e0405a;}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tc.q{background:#2c1f4d;border:1px solid #8a5cf6;color:#dbc9ff;}
.coin{color:#ffd75e;font-weight:800;}
.tt{display:inline-block;padding:1.5px;vertical-align:middle;clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 50%,calc(100% - 7px) 100%,7px 100%,0 50%);}
.tt>span{display:flex;align-items:center;padding:2px 11px;font-weight:700;font-size:10px;letter-spacing:2px;white-space:nowrap;font-family:'Hiragino Mincho ProN','Yu Mincho',serif;clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 50%,calc(100% - 7px) 100%,7px 100%,0 50%);}
.tt.N{background:linear-gradient(180deg,#cbd4de,#7f8a98);}.tt.N>span{background:#23221e;color:#dfe6ee;}
.tt.R{background:linear-gradient(180deg,#e8c96a,#b18a2c);}.tt.R>span{background:#1d2450;color:#f3e6b8;}
.tt.SR{background:linear-gradient(180deg,#e8c96a,#b18a2c);}.tt.SR>span{background:linear-gradient(180deg,#872424,#6a1a1a);color:#f7e9c2;}
.tt.LR{background:linear-gradient(180deg,#8a5f14,#6b470c);box-shadow:0 0 8px rgba(232,201,106,.4);}.tt.LR>span{background:linear-gradient(180deg,#f6e394,#c79c2e);color:#3a2905;}
.pomc{background:#141830;border:1px solid #262c47;border-radius:12px;padding:10px 12px;margin-top:10px;}
.pomc.live{border-color:#19a974;}
.pomc.done{opacity:.8;}
.porow{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px;}
.porow.win{font-weight:900;}
.porow.lose{color:#8890b0;}
.poseed{display:inline-block;min-width:22px;text-align:center;background:#2a3050;border-radius:6px;font-size:11px;font-weight:800;padding:2px 0;color:#cdd4f5;flex-shrink:0;}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;background:#2a3050;color:#cdd4f5;}
.chip.g{background:#123a28;color:#7de8b6;}
.chip.y{background:#4d3d10;color:#ffe9b0;}
#modal{position:fixed;inset:0;background:rgba(0,0,0,0.65);display:none;z-index:40;overflow:auto;padding:16px;}
#mbox{max-width:420px;margin:36px auto;background:#1a1f33;border-radius:16px;padding:18px;}
#toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));background:#e0405a;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;display:none;z-index:60;text-align:center;}
</style>
</head>

 var u=location.origin+location.pathname;

function esc(s){s=String(s===null||s===undefined?'':s);var o='',i,c;for(i=0;i<s.length;i++){c=s.charAt(i);if(c==='<'){o+='&lt;';}else if(c==='>'){o+='&gt;';}else if(c==='&'){o+='&amp;';}else if(c==='"'){o+='&quot;';}else{o+=c;}}return o;}

async function rpc(name,args){var r=await sb.rpc(name,args||{});if(r.error){throw r.error;}return r.data;}
function val(id){var e=document.getElementById(id);return e?e.value.trim():'';}
function modalOpen(){return document.getElementById('modal').style.display==='block';}

function isEditing(){var e=document.activeElement;return !!(e&&(e.tagName==='INPUT'||e.tagName==='SELECT'));}
function repLabel(r){if(r==='win'){return '勝利報告';}if(r==='lose'){return '敗北報告';}if(r==='draw'){return '引き分け報告';}return '未報告';}
function ttl(t){if(!t){return '';}return '<span class="tt '+esc(t.rarity)+'"><span>'+esc(t.name)+'</span></span>';}
function roundName(r,rounds,third){if(third){return '3位決定戦';}if(r===rounds){return '決勝';}if(r===rounds-1){return '準決勝';}if(r===rounds-2){return '準々決勝';}return r+'回戦';}
function resultText(r,p1,p2){
 if(r==='p1_win'){return esc(p1)+' の勝ち';}
 if(r==='p2_win'){return esc(p2)+' の勝ち';}
 if(r==='draw'){return '引き分け';}
 if(r==='p1_noshow'){return esc(p1)+' 不戦敗';}
 if(r==='p2_noshow'){return esc(p2)+' 不戦敗';}
 if(r==='both_timeout'){return '両者ペナルティ';}
 return 'キャンセル';
}
async function boot(){var s=await sb.auth.getSession();if(s.data.session){afterLogin();}else{renderAuth();}}
sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT'){clearInterval(aIv);A=null;ME=null;curTid=null;renderAuth();}});
async function afterLogin(){
 try{
  var st=await rpc('get_state');
  ME=st.profile;
  if(!ME.is_admin){renderClaim();return;}
  await showList();
 }catch(e){toastMsg(errMsg(e));renderAuth();}
}
function renderAuth(){
 var h='<div class="wrap"><div class="card center"><div style="font-size:22px;font-weight:800;">主催管理</div><div class="mut">レーティング対戦システム</div></div>';

 app().innerHTML=h;
}
function renderClaim(){
 var h='<div class="wrap"><div class="card"><div style="font-weight:800;font-size:17px;">管理者権限がありません</div>';
 h+='<div class="mut" style="margin-top:8px;">管理者登録キーを持っている場合は入力してください。または既存の主催者に権限付与を依頼してください。</div>';
 h+='<input id="akey" placeholder="管理者登録キー"><button class="btn" data-act="claim">管理者として登録</button>';
 h+='<button class="btn gray" data-act="recheck">権限を再確認</button>';
 h+='<button class="btn gray" data-act="logout">ログアウト</button></div></div>';
 app().innerHTML=h;
}
async function showList(){
 clearInterval(aIv);curTid=null;A=null;
 listCache=await rpc('admin_list_tournaments');
 renderList();
}
function renderList(){
 var h='<div class="wrap"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;"><div style="font-weight:800;font-size:18px;">主催管理</div><button class="sb" data-act="logout">ログアウト</button></div><div class="mut">'+esc(ME.nickname)+'</div><div class="inline"><button class="btn gray" data-act="rateinfo">レート計算の仕組み</button><button class="btn gray" data-act="titlesadm">称号の管理</button></div><button class="btn gray" data-act="pwreset">パスワード再発行</button></div>';
 h+='<div class="card"><div class="label">新しい大会を作成</div>';
 h+='<input id="cname" placeholder="大会名"><input id="cpw" placeholder="大会パスワード（4文字以上）"><input id="ctables" type="number" placeholder="テーブル数"><div class="label" style="margin-top:10px;">マッチング基準</div><select id="cbasis"><option value="overall" selected>通算レート基準（常連が有利になりにくい実力マッチ）</option><option value="day">当日レート基準（その日の調子でマッチ）</option></select>';
 h+='<label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;"><input type="checkbox" id="crated" checked style="width:auto;margin:0;">レーティング変動あり（オフにすると交流会モード）</label>';
 h+='<button class="btn" data-act="create">大会を作成</button></div>';
 h+='<div class="label" style="margin:6px 4px;">大会一覧（タップで管理）</div>';
 if(!listCache||listCache.length===0){h+='<div class="card mut center">まだ大会がありません</div>';}
 else{
  for(var i=0;i<listCache.length;i++){
   var t=listCache[i];
   h+='<div class="card" data-act="open" data-tid="'+t.id+'" style="cursor:pointer;">';
   h+='<div style="display:flex;justify-content:space-between;align-items:center;"><b style="font-size:16px;">'+esc(t.name)+'</b><span class="badge '+(t.status==='active'?'on':'off')+'">'+(t.status==='active'?'開催中':'終了')+'</span></div>';
   h+='<div class="mut" style="margin-top:6px;">参加 '+t.participants+'人 ・ '+t.table_count+'卓'+(t.rated===false?'（交流会）':'')+' ・ PW: '+esc(t.password)+(t.matching_paused?' ・ 募集停止中':'')+'</div>';
   h+='</div>';

 }

async function openDash(tid){
 curTid=tid;
 curView='dash';
 await aTick();
 clearInterval(aIv);
 aIv=setInterval(function(){if(!document.hidden){aTick();}},3000);
}
async function aTick(){
 if(!curTid){return;}
 try{
  if(curView==='po'){
   PA=await rpc('admin_playoff_state',{tid:curTid});
   if(!modalOpen()&&!isEditing()){drawApo();}
   return;
  }
  A=await rpc('admin_state',{tid:curTid});
  offA=Date.parse(A.now)-Date.now();
  if(!modalOpen()&&!isEditing()){renderDash();}
 }catch(e){}
}
function renderDash(){
 if(!A){return;}
 var t=A.tournament;
 var h='<div class="wrap">';
 h+='<button class="sb" data-act="back-list" style="margin:0 0 10px;">← 大会一覧へ</button>';
 h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;"><b style="font-size:17px;">'+esc(t.name)+'</b><span class="badge '+(t.status==='active'?'on':'off')+'">'+(t.status==='active'?'開催中':'終了')+'</span></div>';
 h+='<div class="mut" style="margin-top:6px;">PW: '+esc(t.password)+' ・ '+t.table_count+'卓'+(t.rated===false?'（交流会）':(t.match_basis==='day'?'（当日基準）':''))+' ・ 参加 '+(A.participants?A.participants.length:0)+'人 ・ 待機 '+(A.queue?A.queue.length:0)+'人'+(t.matching_paused?' ・ <span class="minus">募集停止中</span>':'')+'</div>';
 h+='<div class="inline">';
 if(t.status==='active'){
  h+='<button class="btn '+(t.matching_paused?'green':'warn')+'" data-act="pause">'+(t.matching_paused?'募集を再開':'募集を停止')+'</button>';
  h+='<button class="btn gray" data-act="qr">参加QR</button>';
 }
 h+='<button class="btn gray" data-act="arank">ランキング</button>';
 h+='<button class="btn gray" data-act="csv">CSV出力</button>';
 h+='<button class="btn gray" data-act="rateinfo">レート計算</button>';
 if(t.status==='active'){h+='<button class="btn red" data-act="end">大会終了</button>';}
 h+='</div></div>';
 var po=A.playoff;var elig=A.eligible||0;
 if(t.status==='active'||po){
  h+='<div class="card"><div class="label">🏆 トーナメント（上位決戦）</div>';
  if(!po){
   var sizes=[2,4,8,16,32,64].filter(function(sz){return sz<=elig;});

   else{
    h+='<div class="mut" style="margin-top:6px;">当日レート上位から選出（対象 '+elig+'人）</div>';
    h+='<div style="display:flex;gap:8px;align-items:center;margin-top:4px;"><select id="posize" style="margin-top:0;flex:1;">';
    for(var si=0;si<sizes.length;si++){h+='<option value="'+sizes[si]+'"'+(si===sizes.length-1?' selected':'')+'>上位'+sizes[si]+'人</option>';}
    h+='</select><label style="display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;"><input type="checkbox" id="pothird" style="width:auto;margin:0;">3位決定戦</label></div>';
    h+='<button class="btn warn" data-act="postart">トーナメント開始</button>';
    h+='<div class="mut" style="margin-top:6px;font-size:11px;">開始すると進出者は通常マッチング終了。トーナメント戦はレート変動なし・引き分けなし。出場していない人はコインで勝利者予想（ベット）ができます。</div>';
   }
  }else if(po.status==='active'){
   h+='<div style="font-weight:800;margin-top:4px;">進行中（'+po.size+'人）</div>';
   h+='<div class="inline"><button class="btn" data-act="apo">トーナメント表</button><button class="btn red" data-act="pocancel">中止</button></div>';
  }else{
   h+='<div style="font-weight:800;margin-top:4px;">🏆 優勝: '+esc(po.winner||'')+'</div>';
   h+='<button class="btn gray" data-act="apo">トーナメント表を見る</button>';
  }
  h+='</div>';
 }
 h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;"><div class="label">進行ボード（タップ=操作 / 長押し=使用停止・再開）</div>'+(t.status==='active'?'<span style="white-space:nowrap;"><button class="sb" data-act="tminus">−卓</button><button class="sb" data-act="tplus">＋卓</button></span>':'')+'</div><div class="grid">';
 for(var i=0;i<A.tables.length;i++){
  var tb=A.tables[i];var m=tb.match;var pmt=tb.pmatch;var cls='';var inner='';var actAttr='';

   cls='q';
   inner='<div class="no">'+tb.no+'</div><div class="nm">'+esc(pmt.p1)+'</div><div class="nm">'+esc(pmt.p2)+'</div><div style="font-size:9px;">トナメ'+(pmt.status==='pending_start'?'・開始待ち':'・対戦中')+'</div>';
   actAttr=' data-act="potm" data-mid="'+pmt.id+'"';
  }else if(m){
   if(m.status==='pending_start'){
    var over=Date.parse(m.start_deadline)<(Date.now()+offA);
    cls=over?'o':'p';
   }else{cls='g';}
   inner='<div class="no">'+tb.no+'</div><div class="nm">'+esc(m.p1)+'</div><div class="nm">'+esc(m.p2)+'</div>'+(tb.disabled?'<div style="font-size:9px;">停止予約</div>':'');
   actAttr=' data-act="tmod"';
  }else{
   inner='<div class="no">'+tb.no+'</div><div style="margin-top:12px;">'+(tb.disabled?'使用停止':'空き')+'</div>';
  }
  if(tb.disabled){cls+=' x';}
  h+='<div class="tc '+cls+'" data-no="'+tb.no+'"'+actAttr+'>'+inner+'</div>';
 }
 h+='</div><div class="mut" style="margin-top:8px;">黄=開始待ち / 赤=時間切れ / 緑=対戦中 / 紫=トーナメント / 薄赤枠=使用停止</div></div>';
 if(A.queue&&A.queue.length>0){
  h+='<div class="card"><div class="label">待機中</div>';
  for(var i2=0;i2<A.queue.length;i2++){
   var q=A.queue[i2];

  }
  h+='</div>';
 }
 h+='<div class="card"><div class="label">最近の結果（タップで修正）</div>';
 if(!A.recent||A.recent.length===0){h+='<div class="mut" style="margin-top:6px;">まだ結果がありません</div>';}
 else{
  for(var i3=0;i3<A.recent.length;i3++){
   var rr=A.recent[i3];
   h+='<div class="rowline" data-act="fixmod" data-mid="'+rr.id+'" style="cursor:pointer;"><span>T'+rr.table_no+' <span class="mut">'+esc(rr.p1)+' vs '+esc(rr.p2)+'</span><br><b style="font-size:13px;">'+resultText(rr.result,rr.p1,rr.p2)+'</b></span><span class="mut" style="font-size:12px;">'+(rr.p1_delta>=0?'+':'')+rr.p1_delta+' / '+(rr.p2_delta>=0?'+':'')+rr.p2_delta+'</span></div>';
  }
 }
 h+='</div>';
 h+='<div class="card"><div class="label">参加者</div>';
 if(!A.participants||A.participants.length===0){h+='<div class="mut" style="margin-top:6px;">まだ参加者がいません</div>';}
 else{
  for(var i4=0;i4<A.participants.length;i4++){
   var pp=A.participants[i4];
   h+='<div class="rowline"><span class="nm" style="min-width:0;">'+esc(pp.nickname)+' <b>'+pp.rating+'</b> <span class="mut" style="font-size:11px;">日'+pp.day+'・🪙'+pp.coins+'</span>'+(pp.kicked?' <span class="badge off">退出済</span>':'')+'</span><span style="flex-shrink:0;">';
   h+='<button class="sb" data-act="adj" data-nick="'+esc(pp.nickname)+'">レート修正</button>';
   if(!pp.kicked&&t.status==='active'){h+='<button class="sb red" data-act="kick" data-uid="'+pp.id+'" data-nick="'+esc(pp.nickname)+'">退出</button>';}
   h+='</span></div>';
  }
 }
 h+='</div>';
 h+='<div class="card"><div class="label">主催権限の管理</div><div class="inline">';
 h+='<button class="btn gray" data-act="grant1">権限を付与</button><button class="btn gray" data-act="grant0">権限を解除</button></div>';
 h+='<div class="mut" style="margin-top:8px;">対象のニックネームを入力して操作します。</div></div>';
 h+='</div>';
 app().innerHTML=h;
}
function findTableMatch(no){
 for(var i=0;i<A.tables.length;i++){if(A.tables[i].no===no){return A.tables[i].match;}}
 return null;
}
function showTmod(no){

   await showList();
  }
  else if(act==='open'){await openDash(el.getAttribute('data-tid'));}
  else if(act==='back-list'){await showList();}
  else if(act==='pause'){await rpc('admin_pause',{tid:curTid,p:!A.tournament.matching_paused});await aTick();}
  else if(act==='qr'){showQr();}
  else if(act==='rateinfo'){showRateInfo();}
  else if(act==='csv'){await doCsv();}
  else if(act==='end'){
   if(confirm('大会を終了しますか？終了すると参加・マッチングができなくなります。')){
    await rpc('admin_end_tournament',{tid:curTid});
    toastMsg('大会を終了しました');
    await showList();
   }
  }
  else if(act==='tplus'){await rpc('admin_set_tables',{tid:curTid,n:A.tournament.table_count+1});await aTick();}
  else if(act==='tminus'){await rpc('admin_set_tables',{tid:curTid,n:A.tournament.table_count-1});await aTick();}
  else if(act==='tmod'){if(Date.now()-lpFired>800){showTmod(parseInt(el.getAttribute('data-no'),10));}}
  else if(act==='fixmod'){showFix(el.getAttribute('data-mid'));}
  else if(act==='pact'){
   var cfm=el.getAttribute('data-cfm');
   if(!cfm||confirm(cfm)){
    await rpc('admin_resolve_pending',{mid:el.getAttribute('data-mid'),action:el.getAttribute('data-action')});
    hideModal();await aTick();
   }
  }
  else if(act==='fres'){
   if(confirm(el.getAttribute('data-cfm'))){
    await rpc('admin_force_result',{mid:el.getAttribute('data-mid'),res:el.getAttribute('data-res')});
    hideModal();await aTick();
   }
  }
  else if(act==='fixres'){
   if(confirm(el.getAttribute('data-cfm'))){
    await rpc('admin_fix_result',{mid:el.getAttribute('data-mid'),res:el.getAttribute('data-res')});
    toastMsg('結果を修正しました');
    hideModal();await aTick();
   }
  }
  else if(act==='kick'){
   var nk=el.getAttribute('data-nick');
   if(confirm('「'+nk+'」を強制退出させますか？この大会に再参加できなくなります。')){
    await rpc('admin_kick',{tid:curTid,target:el.getAttribute('data-uid')});
    toastMsg('退出させました');
    await aTick();
   }
  }
  else if(act==='adj'){showAdjModal(el.getAttribute('data-nick'));}
  else if(act==='adjgo'){
   var delta=parseInt(val('adv'),10);
   if(isNaN(delta)||delta===0){toastMsg('増減値を入力してください');}
   else{
    var scope=el.getAttribute('data-scope');
    var out=await rpc('admin_adjust_rating',{nick:el.getAttribute('data-nick'),delta:delta,reason:val('adr'),scope:scope});
    toastMsg(out.nickname+' の'+(scope==='day'?'当日':'通算')+'レートを '+out.rating+' に変更しました');
    hideModal();await aTick();
   }
  }
  else if(act==='postart'){
   var sz2=parseInt(val('posize'),10);
   var th2=document.getElementById('pothird');
   if(confirm('当日レート上位'+sz2+'人でトーナメントを開始します。進出者の通常マッチングは終了します。よろしいですか？')){
    await rpc('admin_start_playoff',{tid:curTid,sz:sz2,third:th2?th2.checked:false});
    toastMsg('トーナメントを開始しました');
    curView='po';await aTick();
   }
  }
  else if(act==='pocancel'){
   if(confirm('トーナメントを中止しますか？受付中のベットは全額返還されます。この操作は取り消せません。')){
    await rpc('admin_cancel_playoff',{tid:curTid});
    toastMsg('トーナメントを中止しました');
    await aTick();
   }
  }
  else if(act==='arank'){await showRank();}
  else if(act==='apo'){curView='po';await aTick();}
  else if(act==='apoback'){curView='dash';await aTick();}
  else if(act==='apom'){var am=apoFind(el.getAttribute('data-mid'));if(am){showApoForce(am);}}
  else if(act==='potm'){if(Date.now()-lpFired>800){showPoTmod(parseInt(el.getAttribute('data-no'),10));}}
  else if(act==='pofres'){
   if(confirm(el.getAttribute('data-cfm'))){
    await rpc('admin_playoff_force',{pmid:el.getAttribute('data-mid'),res:el.getAttribute('data-res')});
    toastMsg('確定しました');
    hideModal();await aTick();
   }
  }
  else if(act==='titlesadm'){await showTitlesAdmin();}
  else if(act==='pwreset'){
   var rn=prompt('パスワードを再発行する参加者のニックネーム');
   if(rn&&rn.trim()){
    if(confirm('「'+rn.trim()+'」の仮パスワードを発行します。今のパスワードは使えなくなります。よろしいですか？')){
     var rr=await rpc('admin_reset_password',{nick:rn.trim()});
     showModal('<div style="font-weight:800;font-size:16px;">仮パスワードを発行しました</div><div class="mut" style="margin-top:8px;">'+esc(rr.nickname)+' さんに伝えてください</div><div style="font-size:34px;font-weight:900;letter-spacing:4px;text-align:center;margin:16px 0;font-family:monospace;color:#ffd75e;">'+esc(rr.password)+'</div><div class="mut">ログイン後、ホーム画面の「パスワード変更」で変更できます。この画面を閉じると仮パスワードは再表示できません。</div><button class="btn gray" data-act="mclose">閉じる</button>');
    }
   }
  }
  else if(act==='tadd'){
   var tp3=parseInt(val('taprice'),10);
   if(!val('taname')){toastMsg('称号名を入力してください');}
   else if(isNaN(tp3)||tp3<1){toastMsg('必要コインを入力してください');}
   else{
    await rpc('admin_save_title',{p_id:null,pname:val('taname'),prarity:val('tarare'),pprice:tp3});
    toastMsg('称号を追加しました');
    await showTitlesAdmin();
   }
  }
  else if(act==='tedit'){
   var te=taFind(parseInt(el.getAttribute('data-id'),10));
   if(te){
    var nn2=prompt('称号名',te.name);
    if(nn2!==null&&nn2.trim()!==''){
     var np2=te.price;
     if(te.acquire==='coin'){
      var pv=prompt('必要コイン',te.price);
      if(pv!==null&&pv!==''){np2=parseInt(pv,10);}
     }
     await rpc('admin_save_title',{p_id:te.id,pname:nn2.trim(),prarity:te.rarity,pprice:np2});
     toastMsg('称号を更新しました');
     await showTitlesAdmin();
    }
   }
  }
  else if(act==='ttog'){
   var tg=taFind(parseInt(el.getAttribute('data-id'),10));
   if(tg&&(tg.active?confirm('「'+tg.name+'」を停止しますか？新規の獲得・交換ができなくなります（所持者はそのまま）。'):true)){
    await rpc('admin_toggle_title',{p_id:tg.id});
    await showTitlesAdmin();
   }
  }
  else if(act==='tgrant'){
   var tg2=taFind(parseInt(val('tgtitle'),10));
   if(!val('tgnick')){toastMsg('ニックネームを入力してください');}
   else if(tg2&&confirm('「'+val('tgnick')+'」に称号「'+tg2.name+'」を付与しますか？')){
    var go=await rpc('admin_grant_title',{nick:val('tgnick'),p_title:tg2.id});
    toastMsg(go.nickname+' に「'+go.title+'」を付与しました');
   }
  }
  else if(act==='grant1'||act==='grant0'){
   var g=(act==='grant1');
   var nk3=prompt('対象のニックネームを入力');
   if(nk3){
    await rpc('admin_grant',{nick:nk3,g:g});
    toastMsg(g?'主催権限を付与しました':'主催権限を解除しました');
   }
  }
  else if(act==='mclose'){hideModal();}
 }catch(e){toastMsg(errMsg(e));}
 busy=false;
});
boot();
</script>
</body>
</html>
